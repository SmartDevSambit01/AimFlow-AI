<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#coreGrad)" stroke="#1E293B" stroke-width="2" />
  <!-- Glowing Alexa+ ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="110 35" filter="url(#glow)" />
  <!-- Center pilot compass / adaptive spark -->
  <path d="M32 16 L35.5 28.5 L48 32 L35.5 35.5 L32 48 L28.5 35.5 L16 32 L28.5 28.5 Z" fill="#FFFFFF" opacity="0.95" />
  <circle cx="32" cy="32" r="3.5" fill="#00D2FF" />
</svg>
